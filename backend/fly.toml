app = "docformat-backend"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -c 'python manage.py migrate && python manage.py collectstatic --noinput'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]